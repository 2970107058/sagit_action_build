name: Build kernel for sagit
on:
  watch:
    types: [started]

  workflow_dispatch:

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CI: "false"
    steps:
    - uses: actions/checkout@v4
    - name: Prepare Configuration
      run: |
        CONFIG_ENV=$(cat config.env | grep -w "CONFIG_ENV" | head -n 1 | cut -d "=" -f 2)
        echo "KERNEL_SOURCE=$(cat $CONFIG_ENV | grep -w "KERNEL_SOURCE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_SOURCE_BRANCH=$(cat $CONFIG_ENV | grep -w "KERNEL_SOURCE_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_CONFIG=$(cat $CONFIG_ENV | grep -w "KERNEL_CONFIG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_IMAGE_NAME=$(cat $CONFIG_ENV | grep -w "KERNEL_IMAGE_NAME" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "DISABLE_LTO=$(cat $CONFIG_ENV | grep -w "DISABLE_LTO" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "DISABLE_CC_WERROR=$(cat $CONFIG_ENV | grep -w "DISABLE_CC_WERROR" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        
    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup build kernel environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "DEVICE=sagit" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt-get install -y curl git ftp lftp wget libarchive-tools ccache python2 python2-dev python3
        sudo apt-get install -y pngcrush schedtool dpkg-dev liblz4-tool make optipng maven device-tree-compiler 
        sudo apt-get install -y libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc
        sudo apt-get install -y libxml2-utils libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools lzop flex tree
        sudo apt-get install -y build-essential bc libssl-dev libfl-dev
        sudo apt-get install -y pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl 
        sudo apt-get install -y zip unzip tar gzip bzip2 rar unrar llvm g++-multilib bison gperf zlib1g-dev automake
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace
 
    - name: Download gcc-lineageos
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir gcc-lineageos
        git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-9.3.git gcc-lineageos -b lineage-23.2  --depth=1      

    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: Inspect kernel hooks
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

        echo "===== exec.c ====="
        grep -n -E 'do_execve(at)?_common|do_execve' fs/exec.c || true

        echo "===== stat.c ====="
        grep -n -E 'newfstatat|newfstat|newlstat|fstatat' fs/stat.c || true

        echo "===== open.c ====="
        grep -n -E 'faccessat|do_faccessat' fs/open.c || true

        echo "===== reboot ====="
        grep -n -E 'SYSCALL_DEFINE4\(reboot|sys_reboot' kernel/reboot.c kernel/sys.c 2>/dev/null || true

        echo "===== SELinux ====="
        grep -n -E 'write_op|sel_handle_status_ops|selinux_status_page|selinux_status_lock|policy_rwlock|sel_mutex' \
        security/selinux/selinuxfs.c \
        security/selinux/ss/services.c 2>/dev/null || true

        echo "===== exec.c context ====="
        sed -n '1530,1585p' fs/exec.c

        echo "===== stat.c context ====="
        sed -n '265,320p' fs/stat.c

        echo "===== open.c context ====="
        sed -n '335,365p' fs/open.c

        echo "===== reboot.c context ====="
        sed -n '270,310p' kernel/reboot.c

        echo "===== selinuxfs.c context ====="
        sed -n '50,75p' security/selinux/selinuxfs.c
        sed -n '255,275p' security/selinux/selinuxfs.c
        sed -n '660,680p' security/selinux/selinuxfs.c

        echo "===== services.c context ====="
        sed -n '65,90p' security/selinux/ss/services.c

        echo "===== stat64 definitions ====="
        grep -n -E 'SYSCALL_DEFINE2\(fstat64|SYSCALL_DEFINE4\(fstatat64' fs/stat.c || true
        
    - name: Setup ReSukiSU
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

    - name: Apply ReSukiSU Execve Hook
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          echo "===== Applying ReSukiSU execveat hook ====="

          if grep -q "ksu_handle_execveat" fs/exec.c; then
            echo "[INFO] ksu_handle_execveat already exists, skipping."
            exit 0
          fi

          python3 -c 'from pathlib import Path; p=Path("fs/exec.c"); s=p.read_text(); marker="static int do_execveat_common("; pos=s.find(marker); assert pos != -1, "[ERROR] do_execveat_common() not found"; declaration="#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n\t\t\t\tvoid *argv, void *envp, int *flags);\n#endif\n\n"; s=s[:pos]+declaration+s[pos:]; pos=s.find(marker); brace=s.find("{",pos); assert brace != -1, "[ERROR] function opening brace not found"; call="\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n"; s=s[:brace+1]+call+s[brace+1:]; p.write_text(s); print("[OK] ReSukiSU execveat hook applied.")'

          echo "===== Verify ReSukiSU execveat hook ====="
          grep -n -A12 -B5 "ksu_handle_execveat" fs/exec.c

    - name: Apply ReSukiSU Faccessat Hook
      run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          echo "===== Applying ReSukiSU faccessat hook ====="

          if grep -q "ksu_handle_faccessat" fs/open.c; then
            echo "[INFO] ksu_handle_faccessat already exists, skipping."
            exit 0
          fi

          python3 -c 'from pathlib import Path; p=Path("fs/open.c"); s=p.read_text(); marker="SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)"; pos=s.find(marker); assert pos != -1, "[ERROR] faccessat() not found in fs/open.c"; declaration="#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n\t\t\t\tint *mode, int *flags);\n#endif\n\n"; s=s[:pos]+declaration+s[pos:]; pos=s.find(marker); brace=s.find("{",pos); assert brace != -1, "[ERROR] faccessat() opening brace not found"; call="\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n"; s=s[:brace+1]+call+s[brace+1:]; p.write_text(s); print("[OK] ReSukiSU faccessat hook applied.")'

          echo "===== Verify ReSukiSU faccessat hook ====="
          grep -n -A12 -B5 "ksu_handle_faccessat" fs/open.c

    - name: Apply ReSukiSU Stat Hooks
      run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          echo "===== Applying ReSukiSU stat hooks ====="

          if grep -q "ksu_handle_stat" fs/stat.c; then
            echo "[INFO] ksu_handle_stat already exists, skipping."
          else
            python3 -c 'from pathlib import Path; p=Path("fs/stat.c"); s=p.read_text(); marker="SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,"; pos=s.find(marker); assert pos != -1, "[ERROR] newfstatat() not found in fs/stat.c"; declaration="#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n\t\t\t\tstruct path *path, struct kstat *stat, int *flags);\n#endif\n\n"; s=s[:pos]+declaration+s[pos:]; pos=s.find(marker); brace=s.find("{",pos); assert brace != -1, "[ERROR] newfstatat() opening brace not found"; call="\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, NULL, &stat, &flag);\n#endif\n"; s=s[:brace+1]+call+s[brace+1:]; p.write_text(s); print("[OK] ReSukiSU newfstatat hook applied.")'
          fi

          if grep -q "ksu_handle_newfstat_ret" fs/stat.c; then
            echo "[INFO] ksu_handle_newfstat_ret already exists, skipping."
          else
            python3 -c 'from pathlib import Path; p=Path("fs/stat.c"); s=p.read_text(); marker="SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)"; pos=s.find(marker); assert pos != -1, "[ERROR] newfstat() not found in fs/stat.c"; declaration="#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_newfstat_ret(int *fd, struct stat __user **statbuf);\n#endif\n\n"; s=s[:pos]+declaration+s[pos:]; pos=s.find(marker); brace=s.find("{",pos); assert brace != -1, "[ERROR] newfstat() opening brace not found"; call="\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_newfstat_ret(&fd, &statbuf);\n#endif\n"; s=s[:brace+1]+call+s[brace+1:]; p.write_text(s); print("[OK] ReSukiSU newfstat hook applied.")'
          fi

          if grep -q "ksu_handle_fstat64_ret" fs/stat.c; then
            echo "[INFO] ksu_handle_fstat64_ret already exists, skipping."
          else
            python3 -c 'from pathlib import Path; p=Path("fs/stat.c"); s=p.read_text(); marker="SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)"; pos=s.find(marker); assert pos != -1, "[ERROR] fstat64() not found in fs/stat.c"; declaration="#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_fstat64_ret(int *fd, struct stat64 __user **statbuf);\n#endif\n\n"; s=s[:pos]+declaration+s[pos:]; pos=s.find(marker); brace=s.find("{",pos); assert brace != -1, "[ERROR] fstat64() opening brace not found"; call="\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_fstat64_ret(&fd, &statbuf);\n#endif\n"; s=s[:brace+1]+call+s[brace+1:]; p.write_text(s); print("[OK] ReSukiSU fstat64 hook applied.")'
          fi

          echo "===== Verify ReSukiSU stat hooks ====="
          grep -n -A8 -B5 -E "ksu_handle_stat|ksu_handle_newfstat_ret|ksu_handle_fstat64_ret" fs/stat.c

    - name: Apply ReSukiSU Reboot Hook
      run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          echo "===== Applying ReSukiSU reboot hook ====="

          if grep -q "ksu_handle_sys_reboot" kernel/reboot.c; then
            echo "[INFO] ksu_handle_sys_reboot already exists, skipping."
            exit 0
          fi

          python3 -c 'from pathlib import Path; p=Path("kernel/reboot.c"); s=p.read_text(); marker="SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,"; pos=s.find(marker); assert pos != -1, "[ERROR] reboot() not found in kernel/reboot.c"; declaration="#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,\n\t\t\t\tvoid __user *arg);\n#endif\n\n"; s=s[:pos]+declaration+s[pos:]; pos=s.find(marker); brace=s.find("{",pos); assert brace != -1, "[ERROR] reboot() opening brace not found"; call="\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_sys_reboot(magic1, magic2, cmd, arg);\n#endif\n"; s=s[:brace+1]+call+s[brace+1:]; p.write_text(s); print("[OK] ReSukiSU reboot hook applied.")'

          echo "===== Verify ReSukiSU reboot hook ====="
          grep -n -A12 -B5 "ksu_handle_sys_reboot" kernel/reboot.c
          
    - name: Setup Configuration for Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        
            echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/vendor/xiaomi/${{ env.KERNEL_CONFIG }}
            echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/xiaomi/${{ env.KERNEL_CONFIG }}
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/vendor/xiaomi/${{ env.KERNEL_CONFIG }}
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y" >> arch/arm64/configs/vendor/xiaomi/${{ env.KERNEL_CONFIG }}
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y" >> arch/arm64/configs/vendor/xiaomi/${{ env.KERNEL_CONFIG }}
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y" >> arch/arm64/configs/vendor/xiaomi/${{ env.KERNEL_CONFIG }}
            
        if [ ${{ env.DISABLE_LTO }} = true ]; then
            sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/' arch/arm64/configs/vendor/xiaomi/${{ env.KERNEL_CONFIG }}
            sed -i 's/CONFIG_THINLTO=y/CONFIG_THINLTO=n/' arch/arm64/configs/vendor/xiaomi/${{ env.KERNEL_CONFIG }}
            echo "CONFIG_LTO_NONE=y" >> arch/arm64/configs/vendor/xiaomi/${{ env.KERNEL_CONFIG }}
        fi
        if [ ${{ env.DISABLE_CC_WERROR }} = true ]; then
            echo "CONFIG_CC_WERROR=n" >> arch/arm64/configs/vendor/xiaomi/${{ env.KERNEL_CONFIG }}
        fi

    - name: Build kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)  
            export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc-lineageos/bin:$PATH
            export CROSS_COMPILE=aarch64-linux-

          echo "===== GCC diagnostic ====="
          echo "CC=${CC:-<unset>}"
          echo "CROSS_COMPILE=${CROSS_COMPILE:-<unset>}"
          echo "KCFLAGS=${KCFLAGS:-<unset>}"
          echo "CFLAGS=${CFLAGS:-<unset>}"
          echo "KBUILD_CFLAGS=${KBUILD_CFLAGS:-<unset>}"
          echo "DISABLE_LTO=${DISABLE_LTO:-<unset>}"
          echo "DISABLE_CC_WERROR=${DISABLE_CC_WERROR:-<unset>}"

          echo "===== GCC version ====="
          ${CROSS_COMPILE}gcc --version | head -n 2

          echo "===== GCC wrapper ====="
          which ${CROSS_COMPILE}gcc
          readlink -f $(which ${CROSS_COMPILE}gcc) || true
            
            mkdir -p out
            make ARCH=arm64 O=out clean
            make ARCH=arm64 O=out mrproper
            make ARCH=arm64 O=out vendor/xiaomi/${{ env.KERNEL_CONFIG }}
            ./scripts/config --file out/.config --disable CONFIG_COMPAT_VDSO
            make ARCH=arm64 O=out -j$(nproc --all)

    - name: Check a kernel output files
      run: |
       cd $GITHUB_WORKSPACE/kernel_workspace
       if [ -f android-kernel/out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }} ]; then
           echo "CHECK_FILE_IS_OK=true" >> $GITHUB_ENV
       else
           echo "Kernel output file is empty"
           exit 1
       fi
  
    - name: Make Anykernel3
      if: env.CHECK_FILE_IS_OK == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp android-kernel/out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }} AnyKernel3/
        rm -rf AnyKernel3/.git* AnyKernel3/README.md
    
    - name: Upload ${{ env.KERNEL_IMAGE_NAME }}
      if: env.CHECK_FILE_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.KERNEL_IMAGE_NAME }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/android-kernel/out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }}

    - name: Upload AnyKernel3
      if: env.CHECK_FILE_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/AnyKernel3/*

    - name: Upload boot image
      if: env.MAKE_BOOT_IMAGE_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: boot${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/boot.img
